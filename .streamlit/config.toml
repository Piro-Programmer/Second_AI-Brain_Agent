[server]
fileWatcherType = "none"

[client]
# Never show stack traces or file paths to visitors
showErrorDetails = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0f1016"
secondaryBackgroundColor = "#1a1c28"
textColor = "#f8fafc"
font = "sans serif"
